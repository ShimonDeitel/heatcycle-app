name: Heatcycle
options:
  bundleIdPrefix: com.shimondeitel.heatcycle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Heatcycle:
    type: application
    platform: iOS
    sources:
      - path: Heatcycle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.heatcycle
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Heatcycle/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  HeatcycleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HeatcycleTests
      - path: Heatcycle.storekit
    dependencies:
      - target: Heatcycle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.heatcycle.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  HeatcycleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HeatcycleUITests
    dependencies:
      - target: Heatcycle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.heatcycle.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Heatcycle:
    build:
      targets:
        Heatcycle: all
        HeatcycleTests: [test]
        HeatcycleUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Heatcycle.storekit
    test:
      config: Debug
      storeKitConfiguration: Heatcycle.storekit
      targets:
        - HeatcycleTests
        - HeatcycleUITests
    archive:
      config: Release
